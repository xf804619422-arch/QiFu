<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>礼品卡 · 小程序端原型</title>
<style>
  :root{
    --bg:#F6EFE3; --bg-soft:#FBF6EC;
    --surface:#FFFFFF;
    --ink:#2B1E16; --ink-soft:#5B4637; --muted:#96816C; --faint:#B9A891;
    --coral:#E8502F; --coral-deep:#C63D1F; --coral-soft:rgba(232,80,47,.10);
    --gold:#E9A23B; --gold-deep:#C77F1D; --gold-soft:rgba(233,162,59,.15);
    --green:#3E9B63; --green-soft:rgba(62,155,99,.13);
    --blue:#3D6BC8; --blue-soft:rgba(61,107,200,.12);
    --line:rgba(91,70,55,.13); --line-strong:rgba(91,70,55,.22);
    --nav:#2A1D14; --nav-2:#332318;
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.6;overflow:hidden}

  .demo-wrap{display:flex;height:100vh}

  /* ============ 左侧模块导航 ============ */
  .module-nav{width:216px;flex:none;background:linear-gradient(180deg,var(--nav) 0%,var(--nav-2) 100%);color:#F3E9DB;display:flex;flex-direction:column;position:relative;z-index:20}
  .module-nav:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(300px 200px at 50% 0%,rgba(233,162,59,.14),transparent 70%)}
  .mn-brand{display:flex;align-items:center;gap:12px;padding:22px 18px 18px;position:relative}
  .mn-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(150deg,var(--coral),var(--gold));display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:900;font-size:20px;flex:none;box-shadow:0 8px 20px rgba(232,80,47,.35)}
  .mn-brand b{font-family:var(--serif);font-size:16px;letter-spacing:1px;color:#FFF8EE}
  .mn-brand small{display:block;font-size:10px;color:rgba(243,233,219,.5);letter-spacing:2px;margin-top:1px}
  .mn-label{padding:6px 20px 8px;font-size:10.5px;color:rgba(243,233,219,.38);letter-spacing:2px;position:relative}
  .mn-list{flex:1;overflow-y:auto;padding:0 12px 20px;position:relative}
  .mn-item{display:flex;align-items:center;gap:11px;width:100%;padding:12px 13px;border:none;background:none;color:rgba(243,233,219,.6);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:11px;text-align:left;font-family:inherit;letter-spacing:.5px;transition:all .2s;margin-bottom:4px}
  .mn-item:hover{background:rgba(255,240,220,.06);color:#FFF8EE}
  .mn-item .ic{width:18px;height:18px;flex:none;display:grid;place-items:center}
  .mn-item .ic svg{width:17px;height:17px}
  .mn-item.active{color:#FFF8EE;background:linear-gradient(90deg,rgba(232,80,47,.24),rgba(232,80,47,.06))}
  .mn-item.active:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:3px;background:var(--coral)}
  .mn-item.active .ic{color:var(--coral)}
  .mn-item .tag{margin-left:auto;font-size:10px;color:rgba(243,233,219,.35);background:rgba(255,240,220,.08);border-radius:999px;padding:2px 8px}
  .mn-item.active .tag{color:var(--gold);background:rgba(233,162,59,.15)}
  .mn-foot{padding:15px 18px;border-top:1px solid rgba(255,240,220,.08);font-size:11px;color:rgba(243,233,219,.4);position:relative}

  /* ============ 右侧舞台 ============ */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;overflow:hidden;background:
    radial-gradient(900px 600px at 20% -10%,rgba(233,162,59,.16),transparent 55%),
    radial-gradient(800px 600px at 90% 0%,rgba(232,80,47,.10),transparent 52%),
    var(--bg)}

  /* ============ 手机外框 ============ */
  .phone{width:375px;height:812px;background:#fff;border-radius:44px;border:10px solid #2B1E16;position:relative;z-index:2;
    box-shadow:0 40px 80px -30px rgba(43,30,22,.5);overflow:hidden;display:flex;flex-direction:column}
  .phone .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#2B1E16;border-radius:14px;z-index:30}
  .phone-screen{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg-soft);position:relative}
  .phone-screen::-webkit-scrollbar{width:0}

  /* 状态栏 */
  .pstatus{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--bg-soft);font-size:12px;color:var(--ink);position:relative;z-index:20}
  .pstatus b{font-weight:700}

  /* ============ 通用手机内元素 ============ */
  .pnav{height:48px;flex:none;display:flex;align-items:center;padding:0 16px;background:var(--bg-soft);position:relative;z-index:20}
  .pnav .back{width:34px;height:34px;border:none;background:transparent;display:grid;place-items:center;color:var(--ink);cursor:pointer;font-size:20px}
  .pnav .title{flex:1;text-align:center;font-family:var(--serif);font-size:16px;font-weight:900;letter-spacing:1px}
  .pnav .act{font-size:13px;color:var(--coral-deep);cursor:pointer;border:none;background:none;font-family:inherit;font-weight:600}

  .screen{display:none;min-height:100%;flex-direction:column}
  .screen.active{display:flex}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:13px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:all .2s;width:100%}
  .btn-primary{background:linear-gradient(135deg,var(--coral),var(--coral-deep));color:#fff;box-shadow:0 10px 22px -8px rgba(232,80,47,.55)}
  .btn-primary:active{transform:scale(.98)}
  .btn-ghost{background:var(--surface);color:var(--ink-soft);border:1px solid var(--line-strong)}
  .btn-ghost:active{transform:scale(.98)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ============ 卡面 ============ */
  .gcard{position:relative;border-radius:18px;padding:18px 18px 16px;color:#fff;overflow:hidden;cursor:pointer;transition:transform .2s;box-shadow:0 12px 28px -12px rgba(43,30,22,.5)}
  .gcard:active{transform:scale(.98)}
  .gcard:before{content:"";position:absolute;width:130px;height:130px;border:1.5px solid rgba(255,255,255,.25);border-radius:50%;right:-40px;top:-40px}
  .gcard:after{content:"";position:absolute;width:90px;height:90px;border:1.5px solid rgba(255,255,255,.18);border-radius:50%;right:-18px;top:-18px}
  .gcard .gc-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
  .gcard .gc-logo{font-family:var(--serif);font-weight:900;font-size:22px}
  .gcard .gc-title{font-family:var(--serif);font-weight:900;font-size:17px;letter-spacing:1px;margin-top:18px;position:relative;z-index:2}
  .gcard .gc-batch{font-size:10.5px;color:rgba(255,255,255,.72);letter-spacing:.5px;margin-top:4px;position:relative;z-index:2}
  .gcard .gc-face{margin-top:6px;font-family:var(--serif);font-size:30px;font-weight:900;position:relative;z-index:2}
  .gcard .gc-face span{font-size:16px}
  .gcard .gc-foot{margin-top:20px;display:flex;align-items:center;justify-content:space-between;font-size:11px;position:relative;z-index:2;color:rgba(255,255,255,.85)}
  .gcard .gc-remain{text-align:right}
  .gcard .gc-remain b{display:block;font-size:13px}

  /* 状态标签 */
  .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
  .st:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .st-active{color:#2F8A55;background:rgba(62,155,99,.14)}
  .st-frozen{color:#C63D1F;background:rgba(232,80,47,.14)}
  .st-expired{color:#9A8A72;background:rgba(150,129,108,.16)}
  .st-used{color:#5B4637;background:rgba(91,70,55,.12)}

  /* 卡包列表 */
  .wallet-body{padding:16px 18px 28px;display:flex;flex-direction:column;gap:16px}
  .wallet-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2px}
  .wallet-head h2{font-family:var(--serif);font-size:21px;font-weight:900;letter-spacing:1px}
  .wallet-head span{font-size:12px;color:var(--muted)}
  .gcard.dim{filter:saturate(.3) brightness(.82)}

  /* TAB 筛选 */
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:2px}
  .tab{flex:1;border:none;background:none;padding:8px 0;font-size:12.5px;color:var(--muted);border-radius:9px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .2s;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.active{background:linear-gradient(135deg,var(--coral),var(--coral-deep));color:#fff;box-shadow:0 4px 10px -3px rgba(232,80,47,.5)}

  /* 空态 */
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 30px;text-align:center}
  .empty .e-ico{width:76px;height:76px;border-radius:24px;background:linear-gradient(150deg,var(--coral-soft),var(--gold-soft));display:grid;place-items:center;color:var(--coral);margin-bottom:18px}
  .empty .e-ico svg{width:34px;height:34px}
  .empty b{font-size:16px;color:var(--ink);display:block;margin-bottom:6px}
  .empty p{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.7}
  .empty .btn{max-width:220px}

  /* ============ 分销模块 ============ */
  .dist-body{padding:16px 18px 30px;display:flex;flex-direction:column;gap:14px}

  /* 悬浮底部操作栏（申请分销员提交） */
  .sticky-foot{position:sticky;bottom:0;z-index:10;margin:0 -18px -30px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);box-shadow:0 -8px 20px -12px rgba(91,70,55,.25)}
  .sf-agree{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .sf-agree label{display:inline-flex;align-items:center;gap:4px}

  /* 身份证照片上传 */
  .id-photo{flex:1;height:96px;border-radius:12px;border:1px dashed var(--line-strong);display:grid;place-items:center;cursor:pointer;font-size:13px;color:var(--ink-soft);transition:all .2s;overflow:hidden}
  .id-photo:active{transform:scale(.98)}
  .dist-hero{position:relative;border-radius:18px;padding:20px 18px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#E8502F,#C63D1F);box-shadow:0 12px 28px -12px rgba(232,80,47,.5)}
  .dist-hero:before{content:"";position:absolute;width:140px;height:140px;border:1.5px solid rgba(255,255,255,.22);border-radius:50%;right:-36px;top:-36px}
  .dist-hero:after{content:"";position:absolute;width:90px;height:90px;border:1.5px solid rgba(255,255,255,.16);border-radius:50%;right:-14px;top:-14px}
  .dist-hero .dh-top{display:flex;align-items:center;gap:10px;position:relative;z-index:2}
  .dist-hero .dh-avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:18px;flex:none}
  .dist-hero .dh-name{font-size:15px;font-weight:700}
  .dist-hero .dh-level{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:999px;background:rgba(233,162,59,.3);color:#FFE9C4;font-weight:600}
  .dist-hero .dh-balance{margin-top:18px;position:relative;z-index:2}
  .dist-hero .dh-balance span{font-size:12px;color:rgba(255,255,255,.82);display:block}
  .dist-hero .dh-balance b{font-family:var(--serif);font-size:32px;font-weight:900;letter-spacing:1px}
  .dist-hero .dh-balance small{font-size:13px;color:rgba(255,255,255,.82);margin-left:4px}
  .dist-hero .dh-actions{margin-top:16px;display:flex;gap:10px;position:relative;z-index:2}
  .dist-hero .dh-btn{flex:1;border:none;border-radius:11px;padding:11px 0;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
  .dist-hero .dh-btn.primary{background:#fff;color:var(--coral-deep)}
  .dist-hero .dh-btn.ghost{background:rgba(255,255,255,.16);color:#fff}
  .dist-hero .dh-btn:active{transform:scale(.97)}

  .dist-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dist-cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 14px;cursor:pointer;transition:all .2s}
  .dist-cell:active{transform:scale(.98)}
  .dist-cell .dc-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px}
  .dist-cell .dc-ic svg{width:19px;height:19px}
  .dist-cell b{font-size:14px;color:var(--ink);display:block}
  .dist-cell span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}

  .dist-sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
  .dist-sec .ds-title{font-family:var(--serif);font-size:14px;font-weight:900;letter-spacing:.5px;padding:12px 0 4px;display:flex;align-items:center;justify-content:space-between}
  .dist-sec .ds-title span{font-family:var(--sans);font-size:11.5px;font-weight:400;color:var(--muted)}
  .dist-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .dist-row:last-child{border-bottom:none}
  .dist-row .k{color:var(--muted)}
  .dist-row .v{font-weight:600;color:var(--ink);text-align:right;max-width:64%}
  .dist-row .v.mono{font-family:ui-monospace,"SF Mono","Consolas",monospace;font-size:12px}

  /* 分销表单 */
  .df-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .df-field label{font-size:13px;color:var(--ink);font-weight:600}
  .df-field label .req{color:var(--coral);font-weight:700}
  .df-field label .hint{font-weight:400;color:var(--faint);font-size:11px;margin-left:4px}
  .df-field input,.df-field textarea{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;font-size:13.5px;color:var(--ink);background:var(--surface);font-family:inherit;transition:border-color .2s,box-shadow .2s}
  .df-field input:focus,.df-field textarea:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
  .df-field textarea{resize:none;min-height:70px}
  .df-field .err{font-size:11.5px;color:var(--coral);display:none}
  .df-field.error input,.df-field.error textarea{border-color:var(--coral)}
  .df-field.error .err{display:block}
  .df-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px}

  /* 报备状态标签（小程序内） */
  .dst{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
  .dst:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .dst-follow{color:var(--gold-deep);background:var(--gold-soft)}
  .dst-deal{color:var(--green);background:var(--green-soft)}
  .dst-invalid{color:var(--muted);background:rgba(150,129,108,.14)}
  .dst-wait{color:var(--coral-deep);background:var(--coral-soft)}

  /* 佣金明细 */
  .comm-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
  .comm-item:last-child{border-bottom:none}
  .comm-item .ci-left{display:flex;flex-direction:column;gap:3px}
  .comm-item .ci-no{font-size:12.5px;color:var(--ink-soft);font-weight:600;font-family:ui-monospace,"SF Mono","Consolas",monospace}
  .comm-item .ci-ent{font-size:11.5px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .comm-item .ci-amt{font-family:var(--serif);font-weight:700;color:var(--coral-deep);font-size:14px}
  .comm-item .ci-rate{font-size:11px;color:var(--gold-deep)}

  /* 客户详情：跟进记录与成交记录 */
  .fu-item{background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .fu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .fu-time{font-size:11px;color:var(--faint)}
  .fu-del{font-size:11px;color:var(--coral-deep);cursor:pointer}
  .fu-img{height:80px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px;margin-bottom:8px}
  .fu-text{font-size:13px;color:var(--ink-soft);line-height:1.7}
  .fu-add{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
  .fu-add textarea{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;font-size:13px;color:var(--ink);background:var(--surface);font-family:inherit;resize:vertical;min-height:64px}
  .fu-add textarea:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
  .deal-item{background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:10px}
  .deal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .deal-row:last-child{border-bottom:none}
  .deal-row .k{color:var(--muted)}
  .deal-row .v{font-weight:600;color:var(--ink);text-align:right}

  /* 提现 */
  .wd-balance{background:linear-gradient(135deg,#3A2A1E,#2B1E16);border-radius:16px;padding:18px;color:#fff;text-align:center}
  .wd-balance span{font-size:12px;color:rgba(255,255,255,.7)}
  .wd-balance b{font-family:var(--serif);font-size:30px;font-weight:900;display:block;margin-top:4px}
  .wd-balance small{font-size:12px;color:rgba(255,255,255,.6)}

  .dist-empty{text-align:center;padding:40px 20px;color:var(--faint)}
  .dist-empty .e-ico{width:64px;height:64px;border-radius:20px;background:var(--gold-soft);display:grid;place-items:center;color:var(--gold-deep);margin:0 auto 14px}
  .dist-empty .e-ico svg{width:28px;height:28px}
  .dist-empty b{display:block;color:var(--ink-soft);font-size:14px;margin-bottom:4px}
  .dist-empty p{font-size:12.5px;color:var(--muted)}

  /* ============ 模拟审核悬浮按钮 ============ */
  .sim-audit{position:absolute;right:20px;bottom:20px;z-index:40;display:flex;flex-direction:column;gap:10px}
  .sim-audit .sa-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;border:1px solid rgba(91,70,55,.22);background:rgba(255,255,255,.92);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 8px 22px -8px rgba(91,70,55,.45);transition:transform .2s,box-shadow .2s;font-family:inherit}
  .sim-audit .sa-btn:hover{transform:translateY(-2px)}
  .sim-audit .sa-btn svg{width:16px;height:16px;color:var(--coral)}
  .sim-audit .sa-btn.primary{background:linear-gradient(135deg,var(--coral),var(--coral-deep));color:#fff;border-color:transparent;box-shadow:0 10px 24px -8px rgba(232,80,47,.6)}
  .sim-audit .sa-btn.primary svg{color:#fff}
  .sim-audit .sa-hint{font-size:11px;color:var(--faint);text-align:center;max-width:150px}

  /* ============ 审核驳回弹窗 ============ */
  .modal-mask{position:fixed;inset:0;z-index:90;background:rgba(43,30,22,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px}
  .modal-mask.open{display:flex}
  .modal{width:min(420px,100%);max-height:90vh;background:var(--surface);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 90px -30px rgba(43,30,22,.5)}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-head h2{font-family:var(--serif);font-size:18px;letter-spacing:1px}
  .modal-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .modal-close{width:32px;height:32px;border:none;background:var(--bg-soft);border-radius:10px;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
  .modal-close:hover{background:var(--coral-soft);color:var(--coral)}
  .modal-body{padding:20px;overflow-y:auto}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:10px;background:var(--bg-soft)}
  .btn-danger{background:linear-gradient(135deg,var(--coral-deep),var(--coral));color:#fff;box-shadow:0 8px 18px -8px rgba(232,80,47,.55)}

# 礼品卡模块（卡包 / 扫码绑定 / 卡详情） · 需求文档

## 1. 页面概述

| 项目 | 内容 |
| --- | --- |
| 页面名称 | 礼品卡模块（小程序端） |
| 所属端 | 小程序端 · 礼品卡 → 卡包 / 扫码绑定 / 卡详情 |
| 核心目标 | 面向企业员工用户，提供礼品卡的「卡包查看、扫码绑定激活、卡详情（剩余金额/有效期/适用范围/消费记录）」能力，与后台礼品卡逻辑对齐。 |

## 2. 字段清单

| 字段名 | 类型 | 说明 | 数据来源 |
| --- | --- | --- | --- |
| 卡面（logo/标题/面值） | 图片+文本 | 批次生成时配置 | 后台批次数据 |
| 批次号 | 文本 | 卡面展示 | 后台批次数据 |
| 剩余金额 | 数字 | 面值 − 已消费金额 | 后台消费回写 |
| 状态 | 枚举 | 已激活/挂失冻结/已过期/已用尽 | 后台状态机 |
| 激活方式 | 枚举 | 系统分发 / 用户激活 | 后台记录 |
| 激活时间 | 时间 | 仅已激活后有值 | 后台记录 |
| 有效期 | 日期 | 可延长 | 后台批次/延长 |
| 适用范围 | 文本 | 全部商品 / 指定分类 | 后台批次配置 |
| 消费记录 | 列表 | 订单号/时间/金额 | 消费后生成 |

## 3. 数据来源（业务层面）

- 卡面、批次号、面值、有效期、适用范围由后台礼品卡批次配置下发。
- 剩余金额由后台消费回写；状态由后台状态机维护；激活方式与激活时间由后台记录。
- 消费记录在用户使用礼品卡线上抵扣后生成。

## 4. 功能与交互逻辑

- 卡包：顶部 TAB 按状态筛选（全部/可用/已冻结/已过期/已用尽）；点击卡进入卡详情；右上角「扫码」进入扫码绑定；空态引导扫码。
- 状态展示：已激活→「可用」、挂失冻结→「已冻结」（置灰）、已过期/已用尽→置灰；未激活卡不展示（用户未绑定）。
- 卡面：展示 logo、标题、批次号、面值、剩余金额、有效期。
- 扫码绑定：扫码后自动带入卡号+密码（密码打码显示，不直接展示明文），用户点「确认激活」完成激活（激活方式=用户激活）。
- 卡详情：展示卡面、剩余金额、有效期、适用范围、消费记录。
- 使用卡：礼品卡仅支持线上抵扣，与电商链路对接，本模块原型不单独体现核销。

## 5. 页面流转

| 入口 | 触发 | 目标 |
| --- | --- | --- |
| 左侧模块「礼品卡」 | 点击 | 卡包 |
| 卡包「扫码」 | 点击 | 扫码绑定 |
| 扫码绑定「确认激活」 | 点击 | 激活成功 → 卡包 |
| 卡包卡片 | 点击 | 卡详情 |
| 卡详情「返回」 | 点击 | 卡包 |

## 6. 边界与状态

- 空态：无卡时展示扫码引导。
- 已冻结/已过期/已用尽：卡置灰，不可用，详情仍可查看。
- 扫码失败：提示「二维码无效或已被激活」。
- 与后台对齐：系统分发的卡直接出现在卡包，无需扫码；用户激活的卡通过扫码激活。

# 报备客户 · 需求文档

## 1. 页面概述

| 项目 | 内容 |
| --- | --- |
| 页面名称 | 报备客户 |
| 所属端 | 小程序端 · 分销 → 报备客户 |
| 核心目标 | 分销员填写并提交企业客户报备（提交后进入后台审核），理解保护期与成交绑定关系。 |

## 2. 字段清单

| 字段名 | 类型 | 必填/可选 | 校验规则 | 示例值 | 数据来源 |
| --- | --- | --- | --- | --- | --- |
| 客户企业 / 单位名称 | 文本 | 必填 | 唯一（先报先得） | 长沙星耀文化传媒有限公司 | 用户填写 |
| 统一社会信用代码 | 文本 | 必填 | 18 位，唯一 | 91430102MA4Q5YN29X | 用户填写 |
| 联系人 | 文本 | 可选 | ≤ 50 字符 | 陈经理 | 用户填写 |
| 联系电话 | 文本 | 可选 | 11 位 | 13807310001 | 用户填写 |
| 意向金额 / 预算 | 金额 | 可选 | ≥ 0 | ¥120,000 | 用户填写 |
| 备注 | 文本 | 可选 | ≤ 200 字符 | — | 用户填写 |
| 报备分销员 | 关联 | 系统 | 取当前登录分销员 | 林晚晴 | 登录态带出 |

## 3. 数据来源（业务层面）

- 报备客户信息由分销员在小程序填写；报备分销员取当前登录账号。
- 审核生效：报备提交后进入「报备审核」（待审核），后台审核通过后报备生效。
- 保护期：审核通过后享保护期（天数由后台分销配置维护，默认 30 天），保护期内其他分销员无法通过统一社会信用代码报备同一客户。
- 成交绑定：保护期内成交后，分销员与企业绑定，成为「我的客户」，后续该客户成交持续计佣。
- 报备失效：超保护期未成交自动变为「报备失效」，届时其他分销员可重新报备。

## 4. 功能与交互逻辑

- 「提交报备」：客户企业名称与统一社会信用代码必填（18 位）；校验统一社会信用代码唯一性，待审核 / 报备中 / 已成交的客户不可重复报备；通过后新增报备记录（状态=待审核），等待后台审核。
- 报备说明：提示提交报备后需后台审核，审核通过后报备生效并享保护期。

## 5. 页面流转

| 入口 | 触发 | 目标 |
| --- | --- | --- |
| 报备审核页「＋ 报备客户」 | 点击 | 本页 |
| 本页「提交报备」 | 点击 | 提交成功（待审核） |
| 本页「返回」 | 点击 | 分销中心 |

## 6. 边界与状态

- 必填项未填：Toast 提示「请填写企业名称和统一社会信用代码」。
- 信用代码非 18 位：Toast 提示「请输入 18 位统一社会信用代码」。
- 信用代码重复：Toast 提示「该客户已被报备（待审核 / 报备中 / 已成交），无法重复报备」。

| 核心目标 | 展示分销员的累计提成与逐笔佣金明细，让分销员了解每笔佣金来自哪个礼品卡批次、按什么比例计算。 |

## 2. 字段清单

| 字段名 | 类型 | 必填/可选 | 校验规则 | 示例值 | 数据来源 |
| --- | --- | --- | --- | --- | --- |
| 累计提成 | 金额 | 系统 | 各批次提成之和 | ¥55,800 | 后台计佣 |
| 礼品卡批次号 | 文本 | 系统 | — | GC20260920008 | 后台计佣 |
| 企业 / 单位 | 文本 | 系统 | — | 长沙万象城商业管理有限公司 | 后台报备成交 |
| 支付总额 | 金额 | 系统 | 客户实际支付金额 × 张数 | ¥450,000 | 礼品卡批次 |
| 提成比例 | 百分比 | 系统 | 按分销员等级 | 10% | 分销配置 |
| 提成金额 | 金额 | 系统 | 支付总额 × 提成比例 | ¥45,000 | 后台计佣 |

## 3. 数据来源（业务层面）

- 佣金来源：分销员报备客户 → 后台确认成交 → 创建礼品卡批次 → 关联批次 → 系统按批次「客户实际支付金额」× 提成比例计佣。
- 提成比例由后台「分销配置」按分销员等级维护。

## 4. 功能与交互逻辑

- 顶部展示累计提成总额。
- 明细列表逐笔展示：礼品卡批次号、企业 / 单位、支付总额、提成比例、提成金额。
- 金额千分位展示，比例按百分比展示。

## 5. 页面流转

| 入口 | 触发 | 目标 |
| --- | --- | --- |
| 分销中心「我的佣金」 | 点击 | 本页 |
| 本页「返回」 | 点击 | 分销中心 |

## 6. 边界与状态

- 空态：无佣金时展示「暂无佣金 · 成交关联礼品卡批次后生成佣金」。

# 发起提现 · 需求文档

## 1. 页面概述

| 项目 | 内容 |
| --- | --- |
| 页面名称 | 发起提现 |
| 所属端 | 小程序端 · 分销 → 发起提现 |
| 核心目标 | 分销员查看可提现余额与到账银行卡，发起提现申请，并查看历史提现记录。 |

## 2. 字段清单

| 字段名 | 类型 | 必填/可选 | 校验规则 | 示例值 | 数据来源 |
| --- | --- | --- | --- | --- | --- |
| 可提现余额 | 金额 | 系统 | 累计提成 − 已提现 − 提现中 | ¥30,800 | 后台累计提成 |
| 到账银行卡 | 关联 | 系统 | 沿用入驻提交的卡号 / 开户行 / 开户名 | 工商银行 尾号 2345 | 分销员入驻资料 |
| 提现金额 | 金额 | 必填 | ≥ ¥100，≤ ¥50,000，≤ 可提现余额 | ¥5,000 | 用户输入 |
| 提现单号 | 文本 | 系统 | 唯一 | WD20261103001 | 系统生成 |
| 提现状态 | 枚举 | 系统 | 待审核 / 已到账 / 已驳回 | 待审核 | 后台审核 |

## 3. 数据来源（业务层面）

- 可提现余额 = 累计提成 − 已提现 − 提现中；到账银行卡沿用分销员入驻时提交的收款银行卡。
- 提现门槛与单笔上限由后台「分销配置」维护（默认最低 ¥100、单笔上限 ¥50,000）。

## 4. 功能与交互逻辑

- 顶部展示可提现余额；提现表单展示到账银行卡。
- 「提交提现申请」：校验金额 ≥ ¥100、≤ ¥50,000、≤ 可提现余额，通过后新增一条「待审核」提现记录。
- 提现记录列表展示历史提现单号、金额、时间与状态。

## 5. 页面流转

| 入口 | 触发 | 目标 |
| --- | --- | --- |
| 分销中心「发起提现」 | 点击 | 本页 |
| 本页「提交提现申请」 | 点击 | 新增待审核记录，列表刷新 |
| 本页「返回」 | 点击 | 分销中心 |

## 6. 边界与状态

- 金额低于 ¥100：提示「提现金额需 ≥ ¥100」。
- 金额高于 ¥50,000：提示「单笔提现不得超过 ¥50,000」。
- 金额超过可提现余额：提示「提现金额超过可提现余额」。
- 空态：无提现记录时展示「暂无提现记录」。

  var mdSource='';
  var richHtml='';
  function getDocSource(){
    var el = document.getElementById(screenDoc[currentScreen] || 'req-md-gift');
    return el ? el.textContent.trim() : '';
  }
  function renderDoc(){
    mdSource = getDocSource();
    $('docBody').innerHTML = renderMd(mdSource,false);

  function inline(s,rich){ s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); s=s.replace(/\*\*(.+?)\*\*/g,function(_,t){return rich?'<strong style="font-weight:700;color:#2B1E16">'+t+'</strong>':'<strong>'+t+'</strong>';}); s=s.replace(/`(.+?)`/g,function(_,t){return rich?'<code style="background:#F6E7CF;border-radius:5px;padding:1px 6px;color:#C63D1F">'+t+'</code>':'<code>'+t+'</code>';}); return s; }
  function renderMd(md,rich){
    var lines=md.split('\n'), out=[], i=0;
    while(i<lines.length){
      var l=lines[i];
      if(/^\s*\|/.test(l)){
        var rows=[];
        while(i<lines.length&&/^\s*\|/.test(lines[i])){ var line=lines[i].replace(/^\s*\||\|\s*$/g,''); var cells=line.split('|').map(function(c){return c.trim();}); if(!/^:?-{2,}:?$/.test(cells[0])||!/^\s*:?-+\s*:?\s*$/.test(line)){ rows.push(cells); } i++; }
        var t='<table'+(rich?' style="width:100%;border-collapse:collapse;margin:11px 0;font-size:12px"':'')+'>', head=rows[0], body=rows.slice(1);
        t+='<tr>'; head.forEach(function(c){ t+='<th'+(rich?' style="background:#F6E7CF;color:#2B1E16;font-weight:700;text-align:left;border:1px solid rgba(91,70,55,.22);padding:7px 9px"':'')+'>'+inline(c,rich)+'</th>'; }); t+='</tr>';
        body.forEach(function(r){ t+='<tr>'; r.forEach(function(c){ t+='<td'+(rich?' style="border:1px solid rgba(91,70,55,.22);padding:7px 9px;vertical-align:top"':'')+'>'+inline(c,rich)+'</td>'; }); t+='</tr>'; });
        t+='</table>'; out.push(t); continue;
      }
      if(/^###\s+/.test(l)){ out.push(rich?'<h3 style="font-size:14px;color:#2B1E16;margin:18px 0 8px">'+inline(l.replace(/^###\s+/,''),rich)+'</h3>':'<h3>'+inline(l.replace(/^###\s+/,''),rich)+'</h3>'); }
      else if(/^##\s+/.test(l)){ out.push(rich?'<h2 style="font-size:15.5px;color:#2B1E16;margin:22px 0 9px;padding-left:10px;border-left:3px solid #E8502F">'+inline(l.replace(/^##\s+/,''),rich)+'</h2>':'<h2>'+inline(l.replace(/^##\s+/,''),rich)+'</h2>'); }
      else if(/^#\s+/.test(l)){ out.push(rich?'<h1 style="font-size:19px;color:#2B1E16;margin:4px 0 14px">'+inline(l.replace(/^#\s+/,''),rich)+'</h1>':'<h1>'+inline(l.replace(/^#\s+/,''),rich)+'</h1>'); }
      else if(/^\s*-\s+/.test(l)){ var items=[l.replace(/^\s*-\s+/,'')]; while(i+1<lines.length&&/^\s*-\s+/.test(lines[i+1])){ items.push(lines[++i].replace(/^\s*-\s+/,'')); } var ul=rich?'<ul style="margin:7px 0 7px 20px;line-height:1.85">':'<ul>'; items.forEach(function(it){ ul+='<li>'+inline(it,rich)+'</li>'; }); ul+='</ul>'; out.push(ul); }
      else if(l.trim()===''){ }
      else { out.push(rich?'<p style="margin:7px 0;line-height:1.85">'+inline(l,rich)+'</p>':'<p>'+inline(l,rich)+'</p>'); }
      i++;
    }
    return out.join('');
  }
  var panel=$('docPanel'), backdrop=$('docBackdrop'), docToggle=$('docToggle');
  function openDoc(){ renderDoc(); panel.classList.add('open'); backdrop.classList.add('open'); }
  function closeDoc(){ panel.classList.remove('open'); backdrop.classList.remove('open'); }
  docToggle.addEventListener('click',function(){ panel.classList.contains('open')?closeDoc():openDoc(); });
  backdrop.addEventListener('click',closeDoc);
  $('docClose').addEventListener('click',closeDoc);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDoc(); });
  function copyText(txt,okMsg){
    function fallback(){ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.focus(); ta.select(); var ok=false; try{ok=document.execCommand('copy');}catch(err){} document.body.removeChild(ta); return ok; }
    function done(ok){ toast(ok?okMsg:'复制失败'); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(fallback());}); } else { done(fallback()); }
  }
  function copyRich(html,okMsg){
    function fallback(){ var div=document.createElement('div'); div.innerHTML=html; div.setAttribute('contenteditable','true'); div.style.position='fixed'; div.style.left='-9999px'; div.style.top='0'; document.body.appendChild(div); var range=document.createRange(); range.selectNodeContents(div); var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range); var ok=false; try{ok=document.execCommand('copy');}catch(err){} sel.removeAllRanges(); document.body.removeChild(div); return ok; }
    function done(ok){ toast(ok?okMsg:'复制失败'); }
    if(navigator.clipboard&&window.ClipboardItem){ var item=new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([mdSource],{type:'text/plain'})}); navigator.clipboard.write([item]).then(function(){done(true);},function(){done(fallback());}); } else { done(fallback()); }
  }
  $('copyMd').addEventListener('click',function(){ copyText(mdSource,'已复制 Markdown'); });
  $('copyRich').addEventListener('click',function(){ copyRich(richHtml,'已复制富文本'); });

  /* ============ 初始化 ============ */
  renderWallet();
})();
</script>
